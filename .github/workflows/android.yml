name: Android foundation
on:
  push:
    branches: [main, 'm1/**']
    paths: ['app/**', 'core/**', 'runtime/android/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew*', 'schemas/**', 'tests/**', 'scripts/**', 'docs/**', '.github/workflows/android.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.20+1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Validate Gradle wrapper identity
        run: echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Validate M0 contracts
        env:
          PYRSISTENT_SKIP_EXTENSION: '1'
        run: |
          python -m pip install -r tests/m0/requirements.txt
          python -u scripts/validate_m0.py
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
      - name: Install pinned Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate Gradle configuration
        run: ./gradlew --no-daemon help
      - name: Unit tests, lint and debug APKs
        run: ./gradlew --no-daemon :core:test :runtime:android:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify debug APK signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk"
      - name: Record APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload UI preview APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: StudioDroid-M1-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Test Activity recreation and capture the launcher
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            adb shell am start -W -n org.studiodroid.app/.MainActivity
            adb shell input keyevent KEYCODE_HOME
            adb shell am start -W -n org.studiodroid.app/.MainActivity
            mkdir -p app/build/reports/ui
            adb exec-out screencap -p > app/build/reports/ui/launcher.png
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: M1-validation-${{ github.run_number }}
          path: |
            core/build/reports/tests/
            runtime/android/build/reports/tests/
            app/build/reports/
            app/build/outputs/apk/androidTest/
          if-no-files-found: warn
          retention-days: 14
