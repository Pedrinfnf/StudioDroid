name: Native boundary
on:
  push:
    branches: [main, 'm1/**']
    paths: ['native/**', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK r28c and CMake
        run: sdkmanager 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Compile Android ARM64 JNI type boundary
        run: |
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" -S native -B native/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DCMAKE_BUILD_TYPE=Release
          "$ANDROID_HOME/cmake/3.22.1/bin/cmake" --build native/build --parallel 2
